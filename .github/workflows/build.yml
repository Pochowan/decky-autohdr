name: Build

# Compila el frontend y la capa Vulkan en cada push / PR.
# Al subir una etiqueta vX.Y.Z publica una release con el ZIP instalable.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: 0.14.1
  ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
  VULKAN_HEADERS_TAG: v1.4.309
  # Nombre de la carpeta dentro del ZIP. No cambiarlo: Decky lo usa como carpeta del plugin.
  PLUGIN_DIR: autohdr-gamescope

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install layer toolchain (zig, glslang, Vulkan headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          git clone --depth 1 --branch "${VULKAN_HEADERS_TAG}" https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vkh"

      - name: Build Vulkan layer (x86_64 + x86, glibc 2.28)
        run: |
          ZIG="$RUNNER_TEMP/zig/zig" VULKAN_HEADERS="$RUNNER_TEMP/vkh/include" sh layer/build.sh
          for f in bin/*.so; do
            echo "== $f"; file "$f"
            # Debe cargar en el Steam Linux Runtime (glibc 2.31): no se permite GLIBC > 2.28
            if objdump -T "$f" | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | awk -F. '$2>28{bad=1} END{exit bad}'; then
              echo "glibc OK"
            else
              echo "::error::$f needs glibc > 2.28"; exit 1
            fi
          done

      - name: Validate Python backend
        run: python3 -m py_compile main.py py_modules/*.py

      - name: Package
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"; exit 1
          fi
          P="out/${PLUGIN_DIR}"
          mkdir -p "$P/dist" "$P/bin" "$P/py_modules"
          cp dist/index.js "$P/dist/"
          cp bin/*.so "$P/bin/"
          cp py_modules/*.py "$P/py_modules/"
          cp main.py plugin.json package.json LICENSE THIRD_PARTY_NOTICES.md README.md "$P/"
          ZIP="decky-autohdr-v${VERSION}.zip"
          (cd out && zip -r "../${ZIP}" "${PLUGIN_DIR}")
          unzip -l "$ZIP"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v v="${{ steps.package.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          body_path: release-notes.md
